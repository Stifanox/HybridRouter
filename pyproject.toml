[project]
name = "hybrid-olap-router"
version = "0.1.0"
description = "Hybrydowy router zapytań analitycznych z warstwą semantyczną (BigQuery / DuckDB)"
authors = [{ name = "stifano" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "sqlglot",
    "duckdb",
    "pyarrow",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"
mypy = "*"
types-PyYAML = "*"
httpx = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Polskie znaki w komunikatach/docstringach są zamierzone.
"*" = ["RUF001", "RUF002", "RUF003"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# Tryb ścisły (ADR-013, zasady wspólne pkt 4) dla rdzenia kompilatora oraz (od A4) dla
# synchronizacji, wykonawców i routera, (od A5) dla API.
[[tool.mypy.overrides]]
module = [
    "app.config.*",
    "app.semantic.*",
    "app.planner.*",
    "app.renderers.*",
    "app.sync.*",
    "app.executors.*",
    "app.router.*",
    "app.api.*",
    "app.main",
]
strict = true

# pyarrow nie publikuje adnotacji typów (brak py.typed); typy z pyarrow są traktowane jako Any.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true
